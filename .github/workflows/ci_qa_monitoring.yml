name: QA, Testing & Observability CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa_testing_monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest prometheus_client
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest & QA Check
        run: pytest -v

      - name: Run Evaluation Harness
        run: python -m scripts.eval_harness
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run Node Evaluation
        run: node scripts/eval_harness.js

      - name: Validate Prometheus & Grafana Specs
        run: |
          test -f monitoring/prometheus/prometheus.yml
          test -f monitoring/grafana/dashboard.json
          echo "Observability specifications validated successfully."
