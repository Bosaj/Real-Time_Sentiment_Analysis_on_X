name: 💡 Feature Request
description: Suggest an idea or architectural enhancement for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a great idea or feature to propose? Tell us about it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
